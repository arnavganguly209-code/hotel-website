# Production deploy — Hostinger VPS ONLY
# Target: https://hotel.theglobalorbit.com (/var/www/hotel-website)
#
# Required secrets: VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY
# No public deploy-beacon / deploy-log files are written or requested.

name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Only the newest main deploy should run. Stale queued/in-progress
  # SSH deploys were stacking (~15–22m) and showing as failed/cancelled in Actions
  # even when production was already updated via a later manual/SSH deploy.
  group: production-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy hotel.theglobalorbit.com
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verify GitHub Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euxo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "MISSING SECRET: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets: Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy over SSH (Hostinger VPS)
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 40m
          request_pty: true
          envs: GITHUB_SHA
          script: |
            set -e
            APP_DIR="/var/www/hotel-website"
            LOCK_FILE="/tmp/htp-prod-deploy.lock"
            exec 9>"$LOCK_FILE"
            # Wait for any concurrent SSH/manual deploy to finish (do not -n fail)
            flock 9
            cd "$APP_DIR" || exit 1

            mkdir -p public/uploads/general

            # Purge any historical public diagnostic files (never recreate)
            rm -f public/uploads/general/deploy-beacon.txt \
              public/uploads/general/deploy-log.txt \
              public/__deploy-beacon.txt \
              public/__deploy-status.json \
              public/__db-migrate-status.json \
              public/__db-migrate-log.txt \
              2>/dev/null || true

            if [ ! -d .git ]; then
              echo "ERROR: not a git repo"
              exit 1
            fi
            if [ ! -f .env ]; then
              echo "ERROR: .env missing"
              exit 1
            fi

            export PATH="/usr/local/bin:/usr/bin:/bin:${HOME}/.local/bin:${PATH:-}"

            cp -a .env "/tmp/htp-env-preserve"
            echo "env preserved"

            git fetch origin
            echo "fetch ok"

            # Prefer the exact commit that triggered this workflow; fall back to origin/main
            if [ -n "${GITHUB_SHA:-}" ] && git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
              git reset --hard "$GITHUB_SHA"
            else
              git reset --hard origin/main
            fi
            echo "reset ok HEAD=$(git rev-parse --short HEAD)"

            mkdir -p public/uploads/general
            cp -a /tmp/htp-env-preserve .env
            chmod 600 .env || true
            rm -f /tmp/htp-env-preserve
            echo "env restored"

            # Purge again after reset in case tracked leftovers returned
            rm -f public/uploads/general/deploy-beacon.txt \
              public/uploads/general/deploy-log.txt \
              public/__deploy-beacon.txt \
              public/__deploy-status.json \
              public/__db-migrate-status.json \
              public/__db-migrate-log.txt \
              2>/dev/null || true

            touch public/uploads/.gitkeep
            chmod -R ug+rwX public/uploads || true
            export UPLOADS_ROOT="$APP_DIR/public/uploads"

            chmod +x scripts/vps-env.sh scripts/vps-deploy.sh scripts/ensure-localhost-db.sh || true

            set +e
            # shellcheck disable=SC1091
            . "$APP_DIR/scripts/vps-env.sh"
            ENV_RC=$?
            set -e
            echo "vps-env-rc=$ENV_RC"
            if [ "$ENV_RC" -ne 0 ]; then
              echo "ERROR: vps-env.sh failed"
              exit 1
            fi

            export GITHUB_SHA
            set +e
            bash "$APP_DIR/scripts/vps-deploy.sh"
            DEPLOY_RC=$?
            set -e
            echo "deploy-rc=$DEPLOY_RC HEAD=$(git rev-parse --short HEAD)"

            rm -f public/uploads/general/deploy-beacon.txt \
              public/uploads/general/deploy-log.txt \
              public/__deploy-beacon.txt \
              public/__deploy-status.json \
              public/__db-migrate-status.json \
              public/__db-migrate-log.txt \
              2>/dev/null || true

            exit "$DEPLOY_RC"
